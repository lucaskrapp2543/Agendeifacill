  <!-- Service Worker para controle de cache -->
  <script>
    // Sistema de atualização automática mais robusto
    // HABILITAR SERVICE WORKER EM IP LOCAL PARA TESTE NO CELULAR
    // Desabilitar apenas em localhost (não em IP local)
    const hostname = window.location.hostname;
    const isLocalhostOnly = hostname === 'localhost' || hostname === '127.0.0.1';
    const isLocalIP = /^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/.test(hostname);

    // Determinar se deve registrar Service Worker
    const shouldRegisterSW = !isLocalhostOnly || isLocalIP;

    // Log para debug (apenas em desenvolvimento/IP local)
    if (isLocalhostOnly || isLocalIP) {
      console.log('🔍 Detecção de ambiente:');
      console.log('  - Hostname:', hostname);
      console.log('  - É localhost?', isLocalhostOnly);
      console.log('  - É IP local?', isLocalIP);
      console.log('  - Service Worker suportado?', 'serviceWorker' in navigator);
      console.log('  - Deve registrar?', shouldRegisterSW);
      console.log('  - Service Worker será:', (shouldRegisterSW && 'serviceWorker' in navigator) ? '✅ HABILITADO' : '🚫 DESABILITADO');
    }

    if ('serviceWorker' in navigator && shouldRegisterSW) {
      const swPath = '/sw.js';

      // Log apenas em desenvolvimento
      if (isLocalhostOnly || isLocalIP) {
        console.log('🔄 Tentando registrar Service Worker em:', swPath);
      }

      navigator.serviceWorker.register(swPath).then(function (registration) {
        if (isLocalhostOnly || isLocalIP) {
          console.log('✅ Service Worker registrado com sucesso:', registration);
        }

        // ⚠️ NÃO verificar atualizações imediatamente (evita loops e erros)
        // O navegador verifica automaticamente a cada 24h
        // Verificar apenas periodicamente (a cada 30 minutos)
        let updateCheckInterval = null;

        // Verificar atualizações periodicamente, não imediatamente
        updateCheckInterval = window.setInterval(function () {
          registration.update().catch((error) => {
            // Ignorar erros silenciosamente se não houver atualização
            if (error.message && !error.message.includes('not found') && !error.message.includes('limit exceeded')) {
              console.warn('⚠️ Erro ao verificar atualização do Service Worker:', error);
            }
          });
        }, 30 * 60 * 1000); // 30 minutos

        // Listener para mudanças no service worker
        registration.addEventListener('updatefound', () => {
          console.log('🔄 Nova versão do Service Worker encontrada');

          const newWorker = registration.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('🔄 Nova versão instalada, aguardando ativação');

                // Notificar o usuário sobre a atualização
                if (confirm('Nova versão disponível! Deseja atualizar agora?')) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                }
              }
            });
          }
        });

        // Listener para quando o service worker assume controle
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('🔄 Service Worker assumiu controle, recarregando...');
          if (updateCheckInterval) {
            clearInterval(updateCheckInterval);
          }
          window.location.reload();
        });

      }).catch(function (error) {
        console.error('❌ Service Worker registration failed:', error);
        console.error('   - Erro completo:', error.message, error.stack);
      });
    } else {
      if (!('serviceWorker' in navigator)) {
        console.log('🚫 Service Worker não suportado neste navegador');
      } else if (isLocalhostOnly && !isLocalIP) {
        console.log('🚫 Service Worker desabilitado em localhost');
        console.log('💡 Para testar no celular, use o IP local (ex: http://192.168.0.2:5173)');
      } else {
        console.log('🚫 Service Worker não pode ser registrado');
        console.log('   - shouldRegisterSW:', shouldRegisterSW);
        console.log('   - serviceWorker in navigator:', 'serviceWorker' in navigator);
      }

      // Limpar qualquer service worker existente em desenvolvimento
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let registration of registrations) {
            console.log('🗑️ Removendo service worker em desenvolvimento:', registration);
            registration.unregister();
          }
        });
      }

      // Adicionar função global para limpeza manual
      window.clearAppCache = function () {
        console.log('🧹 Limpeza manual iniciada...');

        // Limpar service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              registration.unregister();
            });
          });
        }

        // Limpar caches
        if ('caches' in window) {
          caches.keys().then(function (cacheNames) {
            cacheNames.forEach(function (cacheName) {
              caches.delete(cacheName);
            });
          });
        }

        // Limpar localStorage
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.includes('agendafacil') || key.includes('appointments_') || key.includes('supabase'))) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));

        console.log('✅ Limpeza concluída! Recarregue a página.');
      };

      console.log('💡 Use window.clearAppCache() no console para limpeza manual');
    }

    // ⚠️ REMOVIDO: Limpeza automática que recarregava página
    // Agora Service Worker SEMPRE busca da rede, não precisa limpar antes

    // ⚠️ SISTEMA DE CACHE BUSTING (apenas adiciona parâmetro, SEM recarregar)
    // Adicionar parâmetro de versão apenas se não existir (evita loops)
    const url = new URL(window.location.href);
    if (!url.searchParams.has('v')) {
      const buildTimestamp = Date.now();
      url.searchParams.set('v', buildTimestamp.toString());
      // Usar replaceState para não recarregar (evita loop)
      window.history.replaceState({}, '', url.toString());
    }

    // 🧪 MODO DE TESTE: Simular comportamento do Instagram (cache agressivo)
    // Adicione ?test=instagram na URL para simular cache agressivo
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('test') === 'instagram') {
      console.log('🧪 MODO TESTE INSTAGRAM ATIVADO');
      console.log('📱 Simulando cache agressivo do navegador in-app do Instagram');

      // Criar cache "antigo" para simular problema
      if ('caches' in window) {
        caches.open('test-old-cache').then(function (cache) {
          // Criar HTML "antigo" corrompido para simular problema
          const oldHTML = '<!DOCTYPE html><html><head><title>Versão Antiga</title></head><body><div id="root"></div></body></html>';
          cache.put(window.location.href, new Response(oldHTML, {
            headers: { 'Content-Type': 'text/html' }
          }));
          console.log('⚠️ Cache antigo criado para simular problema');
        });
      }
    }
  </script>

  <!-- Script de detecção de página branca - DESABILITADO EM DESENVOLVIMENTO -->
  <script>
    // ⚠️ DETECÇÃO AUTOMÁTICA DE PÁGINA BRANCA (APENAS EM PRODUÇÃO)
    // Desabilitado em desenvolvimento para evitar loops
    (function () {
      'use strict';

      // ⚠️ HABILITAR EM IP LOCAL PARA TESTE NO CELULAR
      // Permite testar no celular via IP (192.168.x.x, 10.x.x.x, etc)
      const isLocalhost = window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1' ||
        window.location.hostname.includes('localhost') ||
        window.location.hostname.includes('127.0.0.1');

      // Verificar se é IP local (192.168.x.x, 10.x.x.x, 172.16-31.x.x)
      const isLocalIP = /^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/.test(window.location.hostname);

      // Se for localhost (não IP), desabilitar para evitar loops durante desenvolvimento
      // Mas habilitar para IP local (para testar no celular)
      if (isLocalhost && !isLocalIP) {
        console.log('🚫 Detecção de página branca desabilitada em localhost');
        console.log('💡 Para testar no celular, use o IP local (ex: http://192.168.0.2:5173)');
        return; // Sair apenas se for localhost, não IP local
      }

      if (isLocalIP) {
        console.log('📱 Modo de teste ativado (IP local detectado)');
        console.log('🔍 Detecção de página branca habilitada para teste no celular');
      }

      let whiteScreenDetected = false;
      let reloadAttempts = 0;
      const maxReloadAttempts = 1; // Reduzido para 1 tentativa apenas

      // ⚠️ Verificar se já está em loop de reload ANTES de qualquer coisa
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('reload') === '1') {
        // Se já tentou recarregar, NÃO tentar novamente (evita loop infinito)
        console.log('⚠️ Já tentou recarregar uma vez, não tentando novamente para evitar loop');
        return;
      }

      // Função para detectar página branca (APENAS EM PRODUÇÃO)
      function detectWhiteScreen() {
        const root = document.getElementById('root');

        // Se root não existe, é problema crítico
        if (!root) {
          console.error('❌ Root não encontrado!');
          return; // Não forçar reload automático
        }

        // ⚠️ DETECÇÃO MAIS LENTA: 10 segundos (dar tempo para carregar)
        setTimeout(function () {
          // Se root está vazio
          if (root.children.length === 0 && !whiteScreenDetected) {
            // Verificar se scripts estão carregando
            const scripts = document.querySelectorAll('script[type="module"]');
            let scriptsLoading = false;

            scripts.forEach(function (script) {
              if (script.src) {
                // Verificar se script ainda está carregando
                if (!script.complete && script.readyState !== 'complete') {
                  scriptsLoading = true;
                }
              }
            });

            // Se scripts já carregaram mas React não renderizou após 10 segundos
            if (!scriptsLoading) {
              console.warn('⚠️ Página branca detectada após 10 segundos! React não renderizou.');
              whiteScreenDetected = true;

              // Apenas 1 tentativa de reload
              if (reloadAttempts < maxReloadAttempts) {
                reloadAttempts++;
                const baseUrl = window.location.href.split('?')[0];
                window.location.replace(baseUrl + '?v=' + Date.now() + '&reload=1');
              }
            }
          }
        }, 10000); // 10 segundos - tempo suficiente para carregar
      }

      // Iniciar detecção quando DOM estiver pronto
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', detectWhiteScreen);
      } else {
        detectWhiteScreen();
      }

      // Detectar apenas erros críticos de chunk (não todos os erros)
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') {
          const src = event.target.src || '';
          // Apenas reagir a erros de chunk ou 404 em scripts principais
          if (src.includes('chunk') || src.includes('main') || src.includes('404')) {
            console.error('❌ Erro crítico ao carregar script:', src);
            // Não forçar reload automaticamente - deixar usuário decidir
          }
        }
      }, true);

      // Detectar apenas erros críticos de chunk loading
      window.addEventListener('unhandledrejection', function (event) {
        const errorMsg = String(event.reason || '');
        // Apenas reagir a erros de chunk loading
        if (errorMsg.includes('chunk') && errorMsg.includes('Failed to load')) {
          console.error('❌ Erro crítico de chunk:', event.reason);
          // Não forçar reload automaticamente - deixar usuário decidir
        }
      });
    })();
  </script>
