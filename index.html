    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Agendei Fácil">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json?v=20241219">
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/novo-icone.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/novo-icone.png">
    <link rel="apple-touch-icon" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="96x96" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/novo-icone.png">

    <link rel="apple-touch-icon" sizes="192x192" href="/novo-icone.png">

    <link rel="apple-touch-icon" sizes="512x512" href="/novo-icone.png">
    
    <!-- Meta tags para evitar cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Agendei Fácil">
    <meta name="application-name" content="Agendei Fácil">
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="msapplication-tap-highlight" content="no">
    
    <!-- Service Worker para controle de cache -->
    <script>
      // Força atualização automática
      if ('serviceWorker' in navigator) {
        // Em desenvolvimento, usar Service Worker simplificado
        const swPath = window.location.hostname === 'localhost' ? '/sw-dev.js' : '/sw.js';
        navigator.serviceWorker.register(swPath).then(function(registration) {
          registration.update();
        }).catch(function(error) {
          console.log('Service Worker registration failed:', error);
        });
      }
      
      // Sistema de cache busting SUAVE
      const timestamp = Date.now();
      
      // Adiciona parâmetro de versão na URL apenas se não existir
      if (!window.location.search.includes('v=')) {
        const url = new URL(window.location.href);
        url.searchParams.set('v', timestamp.toString());
        window.history.replaceState({}, '', url.toString());
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CSS removido temporariamente para evitar erro 404 -->
    
    <!-- Script para forçar atualização de cache -->
    <script src="/force-update.js"></script>
  </head>
  <body>
    <div id="root"></div>
