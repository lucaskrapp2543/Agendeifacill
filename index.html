  <!-- Service Worker para controle de cache -->
  <script>
    // ⚠️ DESABILITAR SERVICE WORKER EM MOBILE (causa página branca)
    // Em mobile, Service Worker interfere e causa problemas
    // Desktop: Service Worker ativo (funciona bem)
    // Mobile: Service Worker desabilitado (evita página branca)
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // ✅ SOLUÇÃO DEFINITIVA: NÃO registrar Service Worker em páginas de booking
    const isBookingPage = window.location.pathname.includes('/booking/');
    
    // ⚠️ DETECTAR NAVEGADORES COM PROTEÇÕES (causam loops)
    // IMPORTANTE: no Brave o user-agent pode NÃO conter "Brave" (e pode ser alterado em emulação).
    // Por isso usamos também navigator.brave (detecção confiável em runtime).
    const isBraveRuntime = !!(navigator && navigator.brave);
    // Detecta Brave, Edge com proteções, Firefox com extensões, etc.
    const hasProtections = isBraveRuntime ||
                           navigator.userAgent.includes('Brave') || 
                           (navigator.userAgentData && navigator.userAgentData.brands && 
                            navigator.userAgentData.brands.some(b => b.brand && b.brand.includes('Brave'))) ||
                           (navigator.userAgent.includes('Edg/') && navigator.userAgent.includes('Shields')) ||
                           (navigator.userAgent.includes('Firefox') && navigator.userAgent.includes('Privacy'));
    
    if (hasProtections) {
      console.log('🛡️ Navegador com proteções detectado - Service Worker desabilitado (evita loops)');
    }
    
    // ⚠️ VERIFICAR se SW foi desabilitado por detecção de loop (qualquer navegador)
    const swDisabledByLoop = localStorage.getItem('sw_disabled_loop_detection') === 'true';
    
    if (swDisabledByLoop) {
      console.log('🛡️ Service Worker desabilitado (loop detectado anteriormente)');
    }
    
    if ('serviceWorker' in navigator &&
      window.location.hostname !== 'localhost' &&
      window.location.hostname !== '127.0.0.1' &&
      !window.location.hostname.includes('localhost') &&
      !window.location.hostname.includes('127.0.0.1') &&
      !isMobile && // ⚠️ NÃO registrar em mobile
      !isBookingPage && // ⚠️ NÃO registrar em booking (evita cache problemático)
      !hasProtections && // ⚠️ NÃO registrar em navegadores com proteções (evita loops)
      !swDisabledByLoop) { // ⚠️ NÃO registrar se foi desabilitado por loop detectado

      const swPath = '/sw.js';

      navigator.serviceWorker.register(swPath).then(function (registration) {
        console.log('✅ Service Worker registrado (desktop):', registration);

        // ⚠️ NÃO verificar atualizações imediatamente (evita loops e erros)
        // O navegador verifica automaticamente a cada 24h
        // Verificar apenas periodicamente (a cada 30 minutos)
        let updateCheckInterval = null;

        // Verificar atualizações periodicamente, não imediatamente
        updateCheckInterval = window.setInterval(function () {
          registration.update().catch((error) => {
            // Ignorar erros silenciosamente se não houver atualização
            if (error.message && !error.message.includes('not found') && !error.message.includes('limit exceeded')) {
              console.warn('⚠️ Erro ao verificar atualização do Service Worker:', error);
            }
          });
        }, 30 * 60 * 1000); // 30 minutos

        // Listener para mudanças no service worker
        registration.addEventListener('updatefound', () => {
          console.log('🔄 Nova versão do Service Worker encontrada');

          const newWorker = registration.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('🔄 Nova versão instalada, aguardando ativação');

                // Notificar o usuário sobre a atualização
                if (confirm('Nova versão disponível! Deseja atualizar agora?')) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                }
              }
            });
          }
        });

        // Listener para quando o service worker assume controle
        // ⚠️ PROTEÇÃO: Adicionar flag para evitar múltiplos reloads
        // ⚠️ PROTEÇÃO: Desabilitar controllerchange em navegadores com proteções (causa loops infinitos)
        const isBraveRuntimeInner = !!(navigator && navigator.brave);
        const hasProtectionsInHTML = isBraveRuntimeInner ||
                                      navigator.userAgent.includes('Brave') || 
                                      (navigator.userAgentData && navigator.userAgentData.brands && 
                                       navigator.userAgentData.brands.some(b => b.brand && b.brand.includes('Brave'))) ||
                                      (navigator.userAgent.includes('Edg/') && navigator.userAgent.includes('Shields')) ||
                                      (navigator.userAgent.includes('Firefox') && navigator.userAgent.includes('Privacy'));
        
        if (!hasProtectionsInHTML) {
          let isReloading = false;
          let controllerChangeTimeout = null;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            // ⚠️ PROTEÇÃO: Evitar reload se já está recarregando
            if (isReloading) {
              console.log('🔄 Já está recarregando, ignorando controllerchange...');
              return;
            }

            // ⚠️ PROTEÇÃO: Limpar timeout anterior se existir (evita múltiplos reloads)
            if (controllerChangeTimeout) {
              clearTimeout(controllerChangeTimeout);
            }

            console.log('🔄 Service Worker assumiu controle, aguardando antes de recarregar...');
            isReloading = true;

            if (updateCheckInterval) {
              clearInterval(updateCheckInterval);
            }

            // ⚠️ PROTEÇÃO: Aguardar mais tempo e verificar se realmente precisa recarregar
            controllerChangeTimeout = setTimeout(() => {
              // Verificar se a página já está carregada corretamente antes de recarregar
              if (document.readyState === 'complete' && !document.querySelector('[data-reload-needed]')) {
                console.log('✅ Página já carregada corretamente, não precisa recarregar');
                isReloading = false;
                return;
              }
              
              console.log('🔄 Recarregando página...');
              window.location.reload();
            }, 2000); // Aumentado para 2 segundos para dar tempo da página carregar
          });
        } else {
          console.log('🛡️ Navegador com proteções detectado - controllerchange desabilitado (evita loops infinitos)');
        }

      }).catch(function (error) {
        console.log('Service Worker registration failed:', error);
      });
    } else {
      // ✅ SOLUÇÃO DEFINITIVA: Remover Service Worker em mobile, booking E navegadores com proteções
      // Detectar navegadores com proteções de forma síncrona (fallback)
      const isBraveRuntimeSync = !!(navigator && navigator.brave);
      const hasProtectionsSync = isBraveRuntimeSync ||
                                  navigator.userAgent.includes('Brave') || 
                                  (navigator.userAgentData && navigator.userAgentData.brands && 
                                   navigator.userAgentData.brands.some(b => b.brand && b.brand.includes('Brave'))) ||
                                  (navigator.userAgent.includes('Edg/') && navigator.userAgent.includes('Shields')) ||
                                  (navigator.userAgent.includes('Firefox') && navigator.userAgent.includes('Privacy'));
      
      if (isMobile || isBookingPage || hasProtectionsSync) {
        if (hasProtectionsSync) {
          console.log('🛡️ Navegador com proteções detectado - Service Worker desabilitado (evita loops)');
        } else {
          console.log('📱 Service Worker desabilitado em mobile/booking (evita página branca e cache problemático)');
        }

        // ⚠️ REMOVER Service Workers existentes em mobile/booking E remover listeners
        if ('serviceWorker' in navigator) {
          // ⚠️ IMPORTANTE: Remover TODOS os listeners de controllerchange antes de remover SW
          // Isso evita que o listener cause reload após remover o SW
          const controllerChangeHandler = () => {
            console.log('⚠️ Controller change em mobile ignorado (SW deve ser removido)');
          };

          // Remover listener antigo se existir
          navigator.serviceWorker.removeEventListener('controllerchange', controllerChangeHandler);

          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              console.log('🗑️ Removendo Service Worker em mobile:', registration);
              registration.unregister().catch(err => {
                console.warn('⚠️ Erro ao remover SW em mobile:', err);
              });
            });

            // Aguardar um pouco e verificar se ainda há SWs ativos
            setTimeout(() => {
              navigator.serviceWorker.getRegistrations().then(function (remainingRegs) {
                if (remainingRegs.length > 0) {
                  console.warn('⚠️ Ainda há Service Workers ativos em mobile, forçando remoção...');
                  remainingRegs.forEach(function (reg) {
                    reg.unregister().catch(() => { });
                  });
                }
              });
            }, 500);
          });
        }
      } else {
        console.log('🚫 Service Worker desabilitado em desenvolvimento');
      }

      // Limpar qualquer service worker existente em desenvolvimento
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let registration of registrations) {
            console.log('🗑️ Removendo service worker em desenvolvimento:', registration);
            registration.unregister();
          }
        });
      }

      // Adicionar função global para limpeza manual
      window.clearAppCache = function () {
        console.log('🧹 Limpeza manual iniciada...');

        // Limpar service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              registration.unregister();
            });
          });
        }

        // Limpar caches
        if ('caches' in window) {
          caches.keys().then(function (cacheNames) {
            cacheNames.forEach(function (cacheName) {
              caches.delete(cacheName);
            });
          });
        }

        // Limpar localStorage
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.includes('agendafacil') || key.includes('appointments_') || key.includes('supabase'))) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));

        console.log('✅ Limpeza concluída! Recarregue a página.');
      };

      console.log('💡 Use window.clearAppCache() no console para limpeza manual');
    }

    // ⚠️ REMOVIDO: Parâmetro ?v= não é mais necessário
    // Service Worker agora NUNCA faz cache de HTML e SEMPRE busca da rede
    // Não precisa mais de parâmetro na URL para forçar bypass
  </script>

      const script = document.createElement('script');
      script.src = '/force-update-all.js';
      document.head.appendChild(script);
    }

<body>
  <div id="root"></div>
  <!-- Script ULTRA AGRESSIVO para mobile - DEVE SER PRIMEIRO E EXECUTAR IMEDIATAMENTE -->
  <script>
    // ⚠️ SOLUÇÃO ULTRA AGRESSIVA PARA MOBILE - EXECUTA ANTES DE QUALQUER COISA
    (function () {
      'use strict';

      // Detectar se é mobile
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      // ⚠️ DESABILITADO: Limpeza agressiva em mobile causava loops e erros
      // Service Worker já está desabilitado em mobile, não precisa de limpeza agressiva
      if (isMobile) {
        console.log('📱 Mobile detectado - Service Worker já desabilitado (sem limpeza agressiva para evitar loops)');
      }
    })();
  </script>
  <!-- Script de detecção de página branca - DEVE SER PRIMEIRO -->
  <script>
    // ⚠️ DETECÇÃO AUTOMÁTICA DE PÁGINA BRANCA (OTIMIZADO PARA MOBILE)
    // Este script detecta se a página não carregou corretamente e força reload
    (function () {
      'use strict';

      // ⚠️ DESABILITAR COMPLETAMENTE EM NAVEGADORES COM PROTEÇÕES (causa loops infinitos)
      // Detecta Brave, Edge com proteções, Firefox com extensões, etc.
      const isBraveRuntimeForWhiteScreen = !!(navigator && navigator.brave);
      const hasProtectionsForWhiteScreen = isBraveRuntimeForWhiteScreen ||
                                            navigator.userAgent.includes('Brave') || 
                                            (navigator.userAgentData && navigator.userAgentData.brands && 
                                             navigator.userAgentData.brands.some(b => b.brand && b.brand.includes('Brave'))) ||
                                            (navigator.userAgent.includes('Edg/') && navigator.userAgent.includes('Shields')) ||
                                            (navigator.userAgent.includes('Firefox') && navigator.userAgent.includes('Privacy'));
      
      if (hasProtectionsForWhiteScreen) {
        console.log('🛡️ Navegador com proteções detectado - Detecção de página branca DESABILITADA (evita loops infinitos)');
        return; // NÃO EXECUTAR NADA em navegadores com proteções
      }

      let whiteScreenDetected = false;
      let reloadAttempts = 0;
      const maxReloadAttempts = 2;

      // ⚠️ DETECÇÃO IMEDIATA: Verificar se já está em loop de reload
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('reload') === '1' && reloadAttempts >= 1) {
        // Se já tentou recarregar e ainda está com problema, mostrar mensagem
        document.body.innerHTML = `
            <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; font-family: system-ui; background: #f5f5f5;">
              <div style="max-width: 400px;">
                <h1 style="font-size: 24px; margin-bottom: 16px; color: #333;">Problema ao carregar</h1>
                <p style="margin-bottom: 24px; color: #666; line-height: 1.6;">
                  Por favor, use os 3 pontinhos do navegador e clique em "Atualizar" ou limpe o cache do navegador.
                </p>
                <button onclick="window.location.reload()" style="background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 500;">
                  Tentar Novamente
                </button>
              </div>
            </div>
          `;
        return;
      }

      // Função para detectar página branca
      function detectWhiteScreen() {
        const root = document.getElementById('root');

        // Se root não existe, é problema crítico
        if (!root) {
          console.error('❌ Root não encontrado!');
          forceReload();
          return;
        }

        // ⚠️ DETECÇÃO ULTRA RÁPIDA PARA MOBILE: 2 segundos (primeira verificação)
        setTimeout(function () {
          // Se root está vazio
          if (root.children.length === 0 && !whiteScreenDetected) {
            // Verificar se scripts estão carregando
            const scripts = document.querySelectorAll('script[type="module"]');
            let scriptsLoading = false;

            scripts.forEach(function (script) {
              if (script.src) {
                // Verificar se script ainda está carregando
                if (!script.complete && script.readyState !== 'complete') {
                  scriptsLoading = true;
                }
              }
            });

            // Se scripts já carregaram mas React não renderizou
            if (!scriptsLoading) {
              console.warn('⚠️ Página branca detectada após 2 segundos! React não renderizou.');
              whiteScreenDetected = true;
              forceReload();
            }
          }
        }, 2000); // Reduzido para 2 segundos (ultra rápido para mobile)

        // Verificar novamente após 4 segundos (backup)
        setTimeout(function () {
          if (root.children.length === 0 && !whiteScreenDetected) {
            console.warn('⚠️ Página branca detectada após 4 segundos!');
            whiteScreenDetected = true;
            forceReload();
          }
        }, 4000); // Reduzido para 4 segundos
      }

      // Função para forçar reload com limpeza de cache
      function forceReload() {
        if (reloadAttempts >= maxReloadAttempts) {
          console.error('❌ Muitas tentativas de reload. Mostrando mensagem de erro.');
          document.body.innerHTML = `
              <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; font-family: system-ui; background: #f5f5f5;">
                <div style="max-width: 400px;">
                  <h1 style="font-size: 24px; margin-bottom: 16px; color: #333;">Erro ao carregar</h1>
                  <p style="margin-bottom: 24px; color: #666; line-height: 1.6;">
                    A página não está carregando corretamente. Por favor, atualize manualmente usando os 3 pontinhos do navegador.
                  </p>
                  <button onclick="window.location.reload()" style="background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 500;">
                    Tentar Novamente
                  </button>
                </div>
              </div>
            `;
          return;
        }

        reloadAttempts++;
        console.log('🔄 Forçando reload (tentativa ' + reloadAttempts + '/' + maxReloadAttempts + ')...');

        // ⚠️ LIMPEZA AGRESSIVA DE CACHE (especialmente para mobile)
        Promise.all([
          // Limpar todos os caches
          'caches' in window ? caches.keys().then(function (cacheNames) {
            return Promise.all(cacheNames.map(function (cacheName) {
              return caches.delete(cacheName);
            }));
          }) : Promise.resolve(),

          // Limpar Service Workers
          'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }) : Promise.resolve(),

          // Limpar localStorage relacionado
          new Promise(function (resolve) {
            try {
              const keys = Object.keys(localStorage);
              keys.forEach(function (key) {
                if (key.includes('agendafacil') || key.includes('cache') || key.includes('version')) {
                  localStorage.removeItem(key);
                }
              });
            } catch (e) {
              console.warn('Erro ao limpar localStorage:', e);
            }
            resolve();
          })
        ]).then(function () {
          console.log('✅ Cache limpo, recarregando...');

          // Recarregar (Service Worker já busca da rede sempre)
          setTimeout(function () {
            window.location.reload();
          }, 300); // Reduzido para 300ms (mais rápido)
        });
      }

      // Iniciar detecção quando DOM estiver pronto (mas NÃO em navegadores com proteções)
      if (!hasProtectionsForWhiteScreen) {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', detectWhiteScreen);
        } else {
          detectWhiteScreen();
        }
      }

      // Detectar erros de carregamento de scripts (mas NÃO em navegadores com proteções)
      if (!hasProtectionsForWhiteScreen) {
        window.addEventListener('error', function (event) {
          if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
            const resourceUrl = event.target.src || event.target.href || '';
            console.error('❌ Erro ao carregar recurso:', resourceUrl);

            // ✅ PROTEÇÃO IMPORTANTE:
            // Bloqueadores/Proteções (ex: Brave Shields/AdBlock) bloqueiam muitos scripts de terceiros
            // (doubleclick, gtm, etc). Isso NÃO deve disparar reload.
            try {
              const parsed = new URL(resourceUrl, window.location.href);
              const isSameOrigin = parsed.origin === window.location.origin;
              const isAppAsset =
                parsed.pathname.startsWith('/assets/') ||
                parsed.pathname === '/src/main.tsx' ||
                parsed.pathname.endsWith('/src/main.tsx');

              if (!isSameOrigin || !isAppAsset) {
                console.warn('🛡️ Recurso de terceiro/bloqueado ignorado (sem reload):', parsed.href);
                return;
              }
            } catch (e) {
              // Se não conseguimos parsear, não vamos arriscar reload
              console.warn('🛡️ URL inválida/bloqueada ignorada (sem reload).');
              return;
            }

            // Só chega aqui se for recurso do app (mesma origem) e crítico
            if (!whiteScreenDetected && reloadAttempts < maxReloadAttempts) {
              whiteScreenDetected = true;
              setTimeout(forceReload, 2000);
            }
          }
        }, true);

        // Detectar erros não tratados (mas NÃO em navegadores com proteções)
        window.addEventListener('unhandledrejection', function (event) {
          console.error('❌ Erro não tratado:', event.reason);
          if (!whiteScreenDetected && reloadAttempts < maxReloadAttempts) {
            const errorMsg = String(event.reason || '');
            if (errorMsg.includes('chunk') || errorMsg.includes('404') || errorMsg.includes('Failed to load')) {
              whiteScreenDetected = true;
              setTimeout(forceReload, 2000);
            }
          }
        });
      }
    })();
  </script>
