<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendei Fácil - Sistema de Agendamentos</title>
    <meta name="description" content="Sistema de agendamentos para estabelecimentos e clientes" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Agendei Fácil">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/novo-icone.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/novo-icone.png">
    <link rel="apple-touch-icon" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="96x96" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="384x384" href="/novo-icone.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/novo-icone.png">
    
    <!-- Meta tags para evitar cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Agendei Fácil">
    <meta name="application-name" content="Agendei Fácil">
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="msapplication-tap-highlight" content="no">
    
    <!-- Forçar modo desktop no mobile -->
    <meta name="viewport" content="width=1024, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="standalone">
    <meta name="apple-mobile-web-app-capable" content="standalone">
    
    <!-- Service Worker para controle de cache -->
    <script>
      // Força atualização automática
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          registration.update();
        });
      }
      
      // Adiciona timestamp na URL para forçar reload
      if (!window.location.search.includes('v=')) {
        const url = new URL(window.location.href);
        url.searchParams.set('v', Date.now().toString());
        window.history.replaceState({}, '', url.toString());
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
