<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpar Cache - AgendeiFácil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Limpar Cache</h1>
        <p>Clique no botão abaixo para limpar o cache e forçar a atualização da aplicação:</p>
        
        <button class="btn" onclick="clearCache()">🧹 Limpar Cache e Recarregar</button>
        <button class="btn" onclick="hardReload()">⚡ Recarregamento Forçado</button>
        
        <div id="status"></div>
    </div>

    <script>
        function clearCache() {
            const status = document.getElementById('status');
            status.innerHTML = '<div class="status">🔄 Limpando cache...</div>';
            
            // Limpar cache do service worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) {
                        registration.unregister();
                    }
                });
            }
            
            // Limpar localStorage
            localStorage.clear();
            sessionStorage.clear();
            
            // Limpar cache do navegador
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }
            
            setTimeout(() => {
                status.innerHTML = '<div class="status success">✅ Cache limpo! Recarregando...</div>';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            }, 2000);
        }
        
        function hardReload() {
            const status = document.getElementById('status');
            status.innerHTML = '<div class="status">⚡ Forçando recarregamento...</div>';
            
            // Forçar reload sem cache
            window.location.reload(true);
        }
        
        // Auto-redirect após 5 segundos
        setTimeout(() => {
            window.location.href = '/';
        }, 5000);
    </script>
</body>
</html>
