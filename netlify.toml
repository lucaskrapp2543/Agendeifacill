# Force deploy update - v1
[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_VERSION = "9.6.7"
  NPM_FLAGS = "--include=dev"

# Force usando uma versão LTS do Node.js
[context.production.environment]
  NODE_VERSION = "18.17.0"
  NPM_VERSION = "9.6.7"

# Variáveis de ambiente serão definidas no painel do Netlify 

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build" 