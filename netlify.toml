# API Routes - DEVEM VIR ANTES do catch-all
[[redirects]]
  from = "/api/cancel-appointment"
  to = "/.netlify/functions/cancel-appointment"
  status = 200
  force = true
  methods = ["POST", "OPTIONS"]

# Proxy Supabase pelo mesmo host do site (ex.: agendeifacil.com).
# :path* cobre vários segmentos (/auth/v1/token). Só "*" às vezes não casa tudo e cai no SPA (HTML → erro JSON).
# Manter SUPABASE_URL nas functions apontando para https://api.agendeifacil.com.
[[redirects]]
  from = "/auth/:path*"
  to = "https://api.agendeifacil.com/auth/:path*"
  status = 200
  force = true

[[redirects]]
  from = "/rest/:path*"
  to = "https://api.agendeifacil.com/rest/:path*"
  status = 200
  force = true

[[redirects]]
  from = "/storage/:path*"
  to = "https://api.agendeifacil.com/storage/:path*"
  status = 200
  force = true

[[redirects]]
  from = "/functions/:path*"
  to = "https://api.agendeifacil.com/functions/:path*"
  status = 200
  force = true

[[redirects]]
  from = "/realtime/:path*"
  to = "https://api.agendeifacil.com/realtime/:path*"
  status = 200
  force = true

[[redirects]]
  from = "/graphql/:path*"
  to = "https://api.agendeifacil.com/graphql/:path*"
  status = 200
  force = true

# Catch-all - DEVE VIR POR ÚLTIMO (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20.11.1"
  NPM_VERSION = "9.6.7"
  NPM_FLAGS = "--include=dev"
  # Necessário quando o repositório contém arquivos/pointers do Git LFS
  GIT_LFS_ENABLED = "true"

# Headers (prioridade alta no Netlify) para reduzir Bandwidth/credits
# - HTML sem cache (evita index antigo apontando pra assets antigos)
# - Assets versionados em /assets/* com cache longo e immutable
# - Imagens e arquivos estáticos também com cache longo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para imagens estáticas (se houver no Netlify)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para JS e CSS (build assets)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw-mobile.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/booking/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    X-Cache-Control = "no-cache"

# Force usando uma versão LTS do Node.js
[context.production.environment]
  NODE_VERSION = "20.11.1"
  NPM_VERSION = "9.6.7"

# Variáveis de ambiente serão definidas no painel do Netlify 

[context.deploy-preview]
  command = "npm install --include=dev && npm run quality"

[context.branch-deploy]
  command = "npm install --include=dev && npm run quality"