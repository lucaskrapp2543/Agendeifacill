# Force deploy update - v1
[build]
  publish = "dist"
  command = "npm install --include=dev && npm run build"

## Netlify Functions (API em produção)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

## Rotas de API (Pagar.me)
[[redirects]]
  from = "/api/pagarme/create-recipient"
  to = "/.netlify/functions/pagarme-create-recipient"
  status = 200
  force = true
  methods = ["GET", "POST", "OPTIONS"]

[[redirects]]
  from = "/api/pagarme/create-payment"
  to = "/.netlify/functions/pagarme-create-payment"
  status = 200
  force = true
  methods = ["GET", "POST", "OPTIONS"]

[[redirects]]
  from = "/api/pagarme/check-status"
  to = "/.netlify/functions/pagarme-check-status"
  status = 200
  force = true
  methods = ["GET", "POST", "OPTIONS"]

[[redirects]]
  from = "/api/pagarme/order-details"
  to = "/.netlify/functions/pagarme-order-details"
  status = 200
  force = true
  methods = ["GET", "POST", "OPTIONS"]

# API Routes - DEVEM VIR ANTES do catch-all
[[redirects]]
  from = "/api/cancel-appointment"
  to = "/.netlify/functions/cancel-appointment"
  status = 200
  force = true
  methods = ["POST", "OPTIONS"]

# Catch-all - DEVE VIR POR ÚLTIMO
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_VERSION = "9.6.7"
  NPM_FLAGS = "--include=dev"

# Headers (prioridade alta no Netlify) para reduzir Bandwidth/credits
# - HTML sem cache (evita index antigo apontando pra assets antigos)
# - Assets versionados em /assets/* com cache longo e immutable
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/booking/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Force usando uma versão LTS do Node.js
[context.production.environment]
  NODE_VERSION = "18.17.0"
  NPM_VERSION = "9.6.7"

# Variáveis de ambiente serão definidas no painel do Netlify 

[context.deploy-preview]
  command = "npm install --include=dev && npm run build"

[context.branch-deploy]
  command = "npm install --include=dev && npm run build" 